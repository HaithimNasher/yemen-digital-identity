<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>National Entity Directory | YDII</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f5f8fc}
    .wrap{max-width:1180px;margin:auto;padding:42px 22px 90px}
    .hero{background:#0a1020;color:white;border-radius:26px;padding:34px}
    .hero h1{font-size:38px;margin:0 0 10px}
    .hero p{color:#cbd6ea}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
    input,select{padding:13px 15px;border:1px solid #ccd5e2;border-radius:12px;background:white;font-size:15px}
    input{flex:1;min-width:230px}
    .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .summary span{background:white;border:1px solid #dfe5ee;border-radius:999px;padding:8px 12px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .card{background:white;border:1px solid #dfe5ee;border-radius:18px;padding:20px}
    .name{font-weight:800;font-size:19px}
    .domain{direction:ltr;text-align:right;color:#0a728e;font-weight:700}
    .meta{color:#677489;font-size:14px;margin-top:4px}
    .proposed{display:inline-block;background:#fff3cd;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:8px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>National Entity Directory</h1>
    <p>دليل بيانات منظم للجهات اليمنية، منفصل عن محرك التحقق الحي للنطاقات.</p>
  </section>

  <div class="controls">
    <input id="q" placeholder="ابحث بالاسم أو المدينة أو النطاق...">
    <select id="category">
      <option value="all">كل الفئات</option>
      <option value="ministries">الوزارات</option>
      <option value="universities">الجامعات</option>
    </select>
  </div>

  <div id="summary" class="summary"></div>
  <section id="grid" class="grid"></section>
</main>

<script>
let categories=[];

function flatten(){
  return categories.flatMap(c => (c.entities || []).map(e => ({...e, category:c.category})));
}

function render(){
  const term=document.getElementById('q').value.trim().toLowerCase();
  const cat=document.getElementById('category').value;
  const rows=flatten().filter(x=>{
    const hay=[
      x.name_ar,x.name_en,x.governorate,x.city,
      x.current_domain,x.suggested_ye_domain
    ].filter(Boolean).join(' ').toLowerCase();
    return (cat==='all'||x.category===cat) && (!term||hay.includes(term));
  });

  document.getElementById('summary').innerHTML=categories.map(c =>
    `<span>${c.category}: ${(c.entities||[]).length}</span>`
  ).join('');

  document.getElementById('grid').innerHTML=rows.map(x=>{
    const domain=x.current_domain || x.suggested_ye_domain || '—';
    const proposed=x.domain_status==='PROPOSED';
    return `
      <article class="card">
        <div class="name">${x.name_ar}</div>
        <div class="domain">${domain}</div>
        <div class="meta">${[x.governorate,x.city].filter(Boolean).join(' · ')}</div>
        <div class="meta">${x.verification_status || ''}</div>
        ${proposed?'<span class="proposed">PROPOSED DOMAIN</span>':''}
      </article>
    `;
  }).join('');
}

fetch('data/entities.json')
  .then(r=>r.json())
  .then(d=>{
    categories=d.categories||[];
    render();
  });

document.getElementById('q').addEventListener('input',render);
document.getElementById('category').addEventListener('change',render);
</script>
</body>
</html>
