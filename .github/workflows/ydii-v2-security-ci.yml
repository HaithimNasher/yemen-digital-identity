name: YDII v2 Security and Integrity

on:
  push:
    branches:
      - main
      - feat/ydii-professional-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ydii-v2-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate data and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python version
        run: python --version

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Validate directory
        run: python scripts/validate_directory.py

      - name: Validate policy center
        run: python scripts/validate_policies.py

      - name: Validate project data
        run: python scripts/validate_data.py

      - name: Build GCC parity audit
        run: python scripts/gcc_parity_audit.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  security:
    name: Security and integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Security gate
        run: python scripts/security_gate.py

      - name: Release readiness
        run: python scripts/release_readiness.py
